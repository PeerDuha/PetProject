version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: crypto-nginx

    ports:
      - "${PORT}:80"

    volumes:
      - ./nginx-data:/usr/share/nginx/html

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
